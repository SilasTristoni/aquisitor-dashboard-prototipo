# TEMPLATE ONLY. Creating this Blueprint provisions BILLABLE services.
# Apply only after explicit cost/deployment approval. No Pro workspace features.
services:
  - type: web
    name: thermopower-results-api
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    autoDeployTrigger: "off"
    buildCommand: pip install -r deploy/results-portal/requirements.txt
    preDeployCommand: cd backend && python -m alembic -c portal-alembic.ini upgrade head
    startCommand: cd backend && python -m uvicorn app.portal.application:create_app --factory --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 4 --no-access-log --no-proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: THERMOPOWER_PORTAL_DATABASE_URL
        fromDatabase:
          name: thermopower-results-db
          property: connectionString
      - key: THERMOPOWER_PORTAL_INTEGRITY_KEY
        generateValue: true
      - key: THERMOPOWER_PORTAL_INSTALLATIONS
        sync: false
      - key: THERMOPOWER_PORTAL_PUBLIC_ORIGIN
        sync: false
  - type: web
    name: thermopower-results-viewer
    runtime: static
    autoDeployTrigger: "off"
    buildCommand: cd frontend && npm ci && npm run build:portal
    staticPublishPath: frontend/dist-portal
    envVars:
      - key: VITE_PORTAL_API_ORIGIN
        sync: false
    routes:
      - type: rewrite
        source: /compartilhado
        destination: /portal.html
      - type: rewrite
        source: /
        destination: /portal.html
    headers:
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Frame-Options
        value: DENY
databases:
  - name: thermopower-results-db
    databaseName: thermopower_results
    user: thermopower_results
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: virginia
    postgresMajorVersion: "17"
    ipAllowList: []
