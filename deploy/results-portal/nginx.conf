# Example only: install with a real certificate after infrastructure approval.
# Never proxy this virtual host to the ThermoPower acquisition application.
server {
    listen 443 ssl;
    server_name results.example.invalid;
    ssl_certificate /run/certs/fullchain.pem;
    ssl_certificate_key /run/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/thermopower-results;
    access_log off;
    error_log /dev/null;
    client_max_body_size 25m;
    client_body_timeout 15s;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    location = / { try_files /portal.html =404; }
    location = /compartilhado { try_files /portal.html =404; }
    location /assets/ { try_files $uri =404; }
    location /api/v1/public/shares/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
        proxy_send_timeout 20s;
    }
    location /portal/v1/results {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
        proxy_send_timeout 20s;
    }
    location / { return 404; }
}
