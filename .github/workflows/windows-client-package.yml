name: Windows client package

on:
  workflow_dispatch:
  push:
    tags: ["v*-beta"]
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "installer/**"
      - "scripts/**"
      - "thermopower.spec"
      - "release-config.json"
      - ".github/workflows/windows-client-package.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install -r backend\requirements.txt pyinstaller==6.15.0
          Push-Location frontend
          npm ci
          Pop-Location
      - name: Build and smoke
        shell: pwsh
        run: |
          $Inno = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $Inno) {
            $Candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")
            $Inno = $Candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if ($Inno) { .\scripts\build-windows.ps1 -SkipDependencyInstall }
          else { .\scripts\build-windows.ps1 -SkipDependencyInstall -SkipInstaller }
      - name: Read release metadata
        id: package
        shell: pwsh
        run: |
          $Version = (Get-Content -Raw release-config.json | ConvertFrom-Json).version
          "version=$Version" >> $env:GITHUB_OUTPUT
          "directory=release/ThermoPower-Monitor-$Version" >> $env:GITHUB_OUTPUT
          "artifact_name=ThermoPower-Monitor-$Version-windows" >> $env:GITHUB_OUTPUT
      - name: Upload client package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.directory }}/*
          if-no-files-found: error
      - name: Create draft beta release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: ${{ steps.package.outputs.directory }}
        run: |
          $Files = Get-ChildItem $env:RELEASE_DIRECTORY -File | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" $Files --draft --prerelease --title "ThermoPower Monitor ${{ github.ref_name }}" --notes-file (Join-Path $env:RELEASE_DIRECTORY "release-notes.txt")
